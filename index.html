var enrich={"Punjabi Chicken Curry":{"blurb":"Deeply browned onions, tomato and whole spices cooked down into a proper home-style masala, with chicken simmered until the gravy clings to everything. Rich, savoury and made for rice or torn flatbread.","check":[],"grab":["flatbread if serving that way"]},"Lamb Keema":{"blurb":"Minced lamb cooked hard with onion, tomato, ginger, garlic and warm spices until savoury, slightly oily and intensely moreish. Great with rice, flatbread or straight out of the pot with a spoon.","check":[],"grab":["flatbread if wanted"]},"Chole–Dal Hybrid":{"blurb":"Chickpeas and lentils cooked into a thick, spiced tomato-and-coconut curry that sits somewhere between chana masala and dhal. Comforting, filling and excellent with rice.","check":["chickpeas","lentils"],"grab":[]},"Vegetable Jalfrezi":{"blurb":"Fast-cooked vegetables tossed through a sharp, spiced tomato base so they stay bright and slightly crisp rather than stewing down. Fresher and punchier than a slow curry.","check":[],"grab":["capsicum","featured vegetables"]},"Lamb Keema-Stuffed Paratha":{"blurb":"Spiced lamb mince sealed inside soft flatbread and cooked until crisp and golden outside, juicy and savoury within. Part curry, part bread, part handheld problem.","check":[],"grab":[]},"Lamb Kofta Curry":{"blurb":"Spiced lamb meatballs simmered in a warmly aromatic onion-tomato gravy until the kofta absorb the sauce. Rich, soft and built for scooping up with rice or bread.","check":[],"grab":["flatbread if wanted"]},"Butter Chicken":{"blurb":"Charred or browned chicken folded through a smooth tomato-butter sauce with warm spices and just enough creaminess to round everything out. Rich and familiar without becoming sugary takeaway sauce.","check":[],"grab":[]},"Rogan Josh":{"blurb":"Lamb slow-cooked with aromatic spices into a deep red gravy that is rich, fragrant and meat-forward rather than creamy. Proper cold-weather curry territory.","check":[],"grab":[]},"Dal Makhani":{"blurb":"Whole black lentils and kidney beans cooked low and slow until creamy, then finished with butter for a dark, earthy, luxurious dhal. One of the vegetarian dishes that genuinely rewards an all-afternoon cook.","check":["kidney beans"],"grab":["whole urad dal"]},"Chana Masala":{"blurb":"Chickpeas simmered in a tangy onion-tomato masala with warming spices and enough acidity to keep it bright. Hearty, cheap and one of the easiest meat-free dinners in the catalogue.","check":["chickpeas","lemon if finishing with it"],"grab":[]},"Aloo Gobi":{"blurb":"Potato and cauliflower cooked with turmeric, cumin and coriander until tender with browned edges rather than swimming in sauce. Dry-ish, fragrant and excellent beside a wetter curry.","check":["potatoes"],"grab":["cauliflower"]},"Palak / Saag Paneer":{"blurb":"Paneer folded through a deeply savoury spiced spinach or greens sauce, creamy from the vegetables rather than from loads of dairy. Earthy, rich and very scoopable.","check":[],"grab":["paneer","spinach / saag"]},"Vindaloo":{"blurb":"A sharp, chilli-heavy curry built around vinegar, garlic and warm spices, with enough acidity to cut through rich pork or chicken. Much punchier and more savoury than the cartoonishly hot takeaway version.","check":[],"grab":[]},"Rajma":{"blurb":"Kidney beans simmered in a thick onion-tomato masala until creamy and deeply savoury. Proper Punjabi comfort food, especially spooned over hot rice.","check":["kidney beans"],"grab":[]},"Kofta in Makhani Gravy":{"blurb":"Spiced beef or lamb kofta simmered in a silky tomato-butter sauce. Richer and smoother than a standard kofta curry, with the meatballs carrying plenty of browned flavour into the gravy.","check":[],"grab":[]},"Achari Chicken":{"blurb":"Chicken cooked with pickle-style spices—mustard, fennel and other sharp aromatics—for a tangier, more fragrant curry than the usual onion-tomato base. Bright, savoury and a little different without needing obscure ingredients.","check":[],"grab":[]},"Chicken Tinga Tacos":{"blurb":"Smoky shredded chicken cooked into a tomato, onion and chipotle sauce until juicy but concentrated. Easy taco-night food with plenty of room for sharp pickles, crema and fresh toppings.","check":[],"grab":["tortillas"]},"Carnitas Tacos":{"blurb":"Pork slowly cooked with citrus and fat until tender, then crisped hard at the edges before hitting hot tortillas. Rich, salty, crunchy and ridiculous with something acidic on top.","check":["lime"],"grab":["tortillas","oranges"]},"Chipotle Pork & Beans Tacos":{"blurb":"Pork and beans cooked down with smoky chipotle into a thick, deeply savoury filling that sits somewhere between chilli and taco meat. Excellent with coriander and a squeeze of lime.","check":["canned beans","lime"],"grab":["tortillas"]},"Beef Chile Colorado":{"blurb":"Beef braised until tender in a deep red sauce built from dried Mexican chillies, garlic and warm spices. Rich and earthy rather than tomato-heavy, and made for rice or tortillas.","check":[],"grab":["tortillas if serving that way"]},"Cochinita Pibil":{"blurb":"Yucatán-style pork marinated with achiote and citrus, then slow-cooked until shreddable and intensely aromatic. Best with sharp pickled onion to cut through the richness.","check":[],"grab":["achiote paste","oranges","tortillas","banana leaves if going traditional"]},"Al Pastor":{"blurb":"Pork marinated with dried chilli, achiote and pineapple, then cooked hot so the edges caramelise while the centre stays juicy. Sweet, smoky, tangy and built for tacos.","check":[],"grab":["achiote paste","pineapple","tortillas"]},"Birria":{"blurb":"Long-braised beef in a dark chilli-and-spice broth until the meat collapses and the cooking liquid becomes intensely savoury. Equally good as a bowl or loaded into crisp tortillas.","check":[],"grab":["tortillas if making tacos"]},"Enchiladas Rojas":{"blurb":"Tortillas rolled around a filling, coated in a proper dried-chilli red sauce and baked until everything melds together. Saucy, comforting and very customisable depending on what is in the fridge.","check":[],"grab":["tortillas","cheese if using"]},"Chicken Enchiladas Verdes":{"blurb":"Chicken-filled tortillas covered with a bright green tomatillo sauce, then baked until bubbling. Fresher and sharper than red enchiladas, with plenty of acidity against the rich filling.","check":[],"grab":["tortillas","tomatillos","cheese / crema if using"]},"Fish Tacos":{"blurb":"Hot fish with crisp cabbage, creamy sauce and plenty of acid in a warm tortilla. Fast, fresh and crunchy—the opposite end of Mexican dinner from a long braise.","check":["lime"],"grab":["tortillas","cabbage"]},"Black Bean & Mushroom Tacos":{"blurb":"Mushrooms browned hard for savoury depth, folded through seasoned black beans and piled into tortillas with fresh toppings. Properly satisfying vegetarian tacos rather than a compromise dinner.","check":["canned black beans","lime"],"grab":["tortillas","mushrooms"]},"Thai Green Curry":{"blurb":"Fresh, fragrant and properly punchy: green curry paste cooked into coconut milk with chicken, vegetables and Thai aromatics. Creamy, spicy and bright rather than heavy.","check":[],"grab":["Thai basil","kaffir lime leaves","Thai eggplant / chosen veg","fresh green chillies"]},"Lamb Massaman":{"blurb":"Slow-cooked lamb in a rich coconut curry scented with warm spices, tamarind and roasted peanuts, with potatoes soaking up the sauce. Sweet-savoury, aromatic and built for rice.","check":["potatoes"],"grab":["peanuts","tamarind"]},"Thai Chicken Satay":{"blurb":"Turmeric-and-coconut-marinated chicken cooked hard and smoky, then dragged through a rich peanut sauce. Sweet, salty, nutty and excellent as either dinner or dangerous pre-dinner snacking.","check":[],"grab":["peanuts / peanut butter","fresh chillies if using"]},"Khao Soi":{"blurb":"Northern Thai coconut curry noodle soup with tender chicken, soft noodles and crunchy fried noodles on top. Rich, spicy and brightened by sharp pickles and lime.","check":["lime"],"grab":["fresh egg noodles","pickled mustard greens","crispy noodle garnish"]},"Pad Kra Pao":{"blurb":"Minced meat fried hard with garlic, chilli and holy basil until savoury and slightly sticky, then served over rice with a fried egg. Fast, hot and ridiculously satisfying.","check":[],"grab":["holy basil","fresh chillies"]},"Pad See Ew":{"blurb":"Wide rice noodles wok-fried with meat, greens and a dark sweet-savoury sauce until smoky and caramelised at the edges. Soft, chewy and classic weeknight wok food.","check":[],"grab":["wide fresh rice noodles","Chinese broccoli / gai lan"]},"Pad Thai":{"blurb":"Rice noodles tossed through a tamarind-heavy sweet-sour sauce with egg, protein, bean sprouts and crunch. Proper balance comes from acid, salt and texture rather than sugar alone.","check":["lime"],"grab":["rice noodles","tamarind","bean sprouts","peanuts"]},"Panang Curry":{"blurb":"A thicker, richer Thai curry with coconut, roasted spices and a slightly sweeter profile than red curry. The sauce clings to the meat rather than behaving like soup.","check":[],"grab":["Panang curry paste / paste aromatics","kaffir lime leaves","fresh chilli if finishing"]},"Thai Red Curry":{"blurb":"Coconut curry with red chilli paste, meat or vegetables and fragrant Thai herbs. Rich but still lively, especially with basil and lime leaf through the sauce.","check":[],"grab":["Thai basil","kaffir lime leaves","fresh red chillies","chosen vegetables"]},"Tom Kha Gai":{"blurb":"Coconut chicken soup sharpened with galangal, lemongrass, lime leaf and fish sauce. Creamy, sour, fragrant and much lighter than its coconut base suggests.","check":["lime"],"grab":["galangal","lemongrass","kaffir lime leaves","mushrooms","fresh chilli"]},"Tom Yum":{"blurb":"Hot-and-sour Thai soup driven by lemongrass, lime, chilli and fish sauce, with seafood or chicken cooked briefly in the aromatic broth. Bright, sharp and restorative.","check":["lime"],"grab":["lemongrass","kaffir lime leave function blurb(d){return (enrich[d.name]&&enrich[d.name].blurb)||'Dinner with plenty of flavour and enough personality to earn its place in the family catalogue.'}
function pantryNode(d){
  var e=enrich[d.name]||{}, wrap=document.createElement('div');
  wrap.className='pantry';
  if((!e.check||!e.check.length)&&(!e.grab||!e.grab.length)){
    wrap.className+=' friendly'; wrap.textContent='🟢 Pantry-friendly'; return wrap;
  }
  function row(cls,label,items){
    if(!items||!items.length)return;
    var r=document.createElement('div'); r.className='pantry-row '+cls;
    var strong=document.createElement('strong'); strong.textContent=label; r.appendChild(strong);
    items.forEach(function(item){var s=document.createElement('span');s.className='pantry-chip';s.textContent=item;r.appendChild(s)});
    wrap.appendChild(r);
  }
  row('check','🟡 Check:',e.check); row('grab','🛒 Grab:',e.grab);
  return wrap;
}
function showPantry(target,d){target.innerHTML='';target.appendChild(pantryNode(d));}

  }catch(e){}
}

function render(){saveState();var list=current();el.count.textContent=list.length+' '+(list.length===1?'dish fits':'dishes fit')+' right now.';el.results.innerHTML='';list.slice(0,shown).forEach(function(d){var box=document.createElement('div');box.className='result';var h=document.createElement('h3');h.textContent=d.name;var m=document.createElement('div');m.className='meta';m.textContent=d.cuisine+' · '+d.time+' · '+(d.proven?'✓ Cooked here':'○ New idea');var p=document.createElement('p');p.textContent=blurb(d);var pantry=pantryNode(d);var tags=document.createElement('div');tags.className='tags';d.proteins.concat(d.carbs).forEach(function(t){var s=document.createElement('span');s.className='tag';s.textContent=t;tags.appendChild(s)});var b=document.createElement('button');b.type='button';b.textContent='Choose tonight';b.addEventListener('click',function(){choose(d)});box.appendChild(h);box.appendChild(m);box.appendChild(p);box.appendChild(pantry);box.appendChild(tags);box.appendChild(b);el.results.appendChild(box)});if(shown<list.length){el.more.classList.remove('hidden');el.more.textContent='Show more ('+(list.length-shown)+' left)'}else{el.more.classList.add('hidden')}}
function choose(d){if(!d)return;last=d.name;el.winnerName.textContent=d.name;el.winnerMeta.textContent=d.cuisine+' · '+d.time+' · '+d.proteins.join(' / ')+' · '+d.carbs.join(' / ');el.winnerBlurb.textContent=blurb(d);showPantry(el.winnerPantry,d);el.winner.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function randomPick(){var list=current();if(last&&list.length>1)list=list.filter(function(d){return d.name!==last});if(!list.length)return null;return list[Math.floor(Math.random()*list.length)]}
[el.cuisine,el.protein,el.carb,el.time,el.includeNew].forEach(function(x){x.addEventListener('change',function(){shown=16;el.winner.classList.add('hidden');render()})});
el.pick.addEventListener('click',function(){choose(randomPick())});el.again.addEventListener('click',function(){choose(randomPick())});el.reset.addEventListener('click',function(){try{localStorage.removeItem('dinnerPickerState')}catch(e){};el.cuisine.value='';el.protein.value='';el.carb.value='';el.time.value='';el.includeNew.checked=true;shown=16;last='';el.winner.classList.add('hidden');render()});el.more.addEventListener('click',function(){shown+=16;render()});render();
})();
</script>
</main></body></html>
